# Cloudflare Workers — static assets from dist/
# Build:  npm run build          (local — no version stamp)
# Release: npm run build:release (deploy — stamps YYYYMMDD.HHmm UTC)
# Deploy: npm run deploy  (runs predeploy → release build → verify → wrangler deploy)

name = "image-compressor"
compatibility_date = "2024-01-01"

[assets]
directory = "./dist"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
